<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Redirecting&hellip;</title>
<script>
// GH Pages SPA trick (rafgraph/spa-github-pages).
// Rewrites /team/886Y/ -> /?/team/886Y/ and redirects to index.html.
// Auto-detect project pages (username.github.io/<repo>/) vs custom domain.
var l = window.location;
var pathSegmentsToKeep =
  /\.github\.io$/.test(l.hostname) && l.pathname.split('/').length > 2 ? 1 : 0;
l.replace(
  l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
  l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
  l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
  (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
  l.hash
);
</script>
</head>
<body></body>
</html>
