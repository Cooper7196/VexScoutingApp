<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vex Scouting App</title>
<link rel="shortcut icon" href="/static/favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://unpkg.com/bootstrap-table@1.21.4/dist/bootstrap-table.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
<script src="https://unpkg.com/bootstrap-table@1.21.4/dist/bootstrap-table.min.js"></script>
<style>
  .table-bordered > tbody > tr > td,
  .table-bordered > tbody > tr > th,
  .table-bordered > tfoot > tr > td,
  .table-bordered > tfoot > tr > th,
  .table-bordered > thead > tr > td,
  .table-bordered > thead > tr > th { border: 1px solid DimGray; }
</style>
<script>
// GH Pages SPA redirect decoder: if we landed via 404.html with ?/orig/path,
// rewrite the URL back to the original path before the app boots.
(function (l) {
  if (l.search[1] === '/') {
    var decoded = l.search.slice(1).split('&').map(function (s) {
      return s.replace(/~and~/g, '&');
    }).join('?');
    window.history.replaceState(null, null,
      l.pathname.slice(0, -1) + decoded + l.hash
    );
  }
}(window.location));
</script>
</head>
<body>

<nav class="navbar navbar-light bg-light justify-content-between">
  <div class="container-fluid">
    <div class="navbar-text" style="padding:0">
      <a class="navbar-brand" href="/" data-link>Vex Worlds Scouting</a>
      <p style="margin:0">Created by 886Y</p>
    </div>
    <form id="searchForm" class="d-flex navbar-text" style="margin:0">
      <input class="form-control mr-sm-2" type="search" placeholder="Team Number" id="searchBar" autocomplete="off">
      <button id="searchBtn" class="btn btn-outline-primary my-2 my-sm-0" type="submit">Search</button>
    </form>
  </div>
</nav>

<div id="app">
  <div class="text-center text-muted py-5">Loading&hellip;</div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
